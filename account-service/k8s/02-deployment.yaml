apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: money-movement
  labels:
    app: account-service
    tags.datadoghq.com/service: account-service
    tags.datadoghq.com/env: dev
    tags.datadoghq.com/version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service                     # never change after first deploy (immutable)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: account-service                   # matches selector + Service
        azure.workload.identity/use: "true"    # inject workload identity token (Key Vault)
        tags.datadoghq.com/service: account-service   # Datadog APM service name
        tags.datadoghq.com/env: dev
        tags.datadoghq.com/version: "1.0"
    spec:
      serviceAccountName: account-service      # federated to id-aks-learning-account-service
      nodeSelector:
        workload: apps                         # user node pool
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                       # same user as the Dockerfile
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: account-service-kv
      containers:
        - name: account-service
          image: acrakslearningshripad.azurecr.io/account-service:2957ae6b39871e720a239fb21fe422704a391873   # pipeline replaces this with the new SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: account-service-config
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres.money-movement.svc.cluster.local:5432/accounts
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: account-service-db             # synced from Key Vault by the CSI driver
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-service-db
                  key: password
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:                        # give Spring Boot (+ Datadog tracer) up to 2 min to start
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3