apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: account-service-kv
  namespace: money-movement
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "86c6b2d0-1748-4a2b-bb7f-049b48d19d0c"
    keyvaultName: kv-akslearn-shripad
    tenantId: "8967f687-5146-4254-8939-9972be225d13"
    objects: |
      array:
        - |
          objectName: db-username
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
  secretObjects:
    - secretName: account-service-db
      type: Opaque
      data:
        - objectName: db-username
          key: username
        - objectName: db-password
          key: password
