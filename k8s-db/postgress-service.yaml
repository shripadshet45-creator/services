# HEADLESS SERVICE (clusterIP: None)
# A normal ClusterIP Service = one virtual IP, load-balanced across pods.
# A HEADLESS Service = NO virtual IP; DNS returns the pod's own IP.
# StatefulSets need it so each pod gets a stable DNS name:
#   postgres-0.postgres.money-movement.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: money-movement
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432