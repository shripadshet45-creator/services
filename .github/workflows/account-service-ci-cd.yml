name: Account Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "account-service/**"
      - ".github/workflows/account-service-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "account-service/**"
      - ".github/workflows/account-service-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  id-token: write          # CHANGE 1: lets the job get an OIDC token to log in to Azure
  checks: write            # CHANGE 1: dorny/test-reporter creates a "check" with the test results

concurrency:
  group: account-service-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: account-service
  IMAGE_NAME: account-service

jobs:
  unit-tests:
    name: 1. Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Account Service Unit Tests
          path: account-service/target/surefire-reports/*.xml
          reporter: java-junit

  maven-build:
    name: 2. Maven build
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package application
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload Maven artifact
        uses: actions/upload-artifact@v4
        with:
          name: account-service-jar
          path: account-service/target/*.jar
          if-no-files-found: error
          retention-days: 7

  image-build-push:
    name: 3. Build and push image
    needs: maven-build
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.image.outputs.sha_tag }}   # passed to the deploy job

    steps:
      - uses: actions/checkout@v4

      - name: Download Maven artifact
        uses: actions/download-artifact@v4
        with:
          name: account-service-jar
          path: account-service/target

      - name: Set image variables
        id: image
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "ACR_LOGIN_SERVER repository variable is required" >&2
            exit 1
          fi
          echo "tag=$ACR_LOGIN_SERVER/account-service:${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$ACR_LOGIN_SERVER/account-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # CHANGE 2: OIDC login instead of AZURE_CREDENTIALS (no client secret)
      - name: Azure login (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: github.event_name != 'pull_request'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./account-service
          push: ${{ github.event_name != 'pull_request' }}
          # CHANGE 3: no ":latest" tag - every image has a unique, traceable tag
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.sha_tag }}

  # CHANGE 4: new deploy job
  deploy-dev:
    name: 4. Deploy to AKS (dev)
    needs: image-build-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev                       # waits for your approval
    concurrency:
      group: deploy-account-service-dev
      cancel-in-progress: false            # never cancel a deploy half-way

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-kubectl@v4

      - name: Get kubeconfig
        run: |
          az aks get-credentials \
            -g "${{ vars.AKS_RESOURCE_GROUP }}" \
            -n "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Apply manifests
        run: kubectl apply -f account-service/k8s/

      - name: Use this build's image
        run: |
          kubectl set image deployment/account-service \
            account-service=${{ needs.image-build-push.outputs.sha_tag }} \
            -n microservices

      - name: Wait for rollout
        run: kubectl rollout status deployment/account-service -n microservices --timeout=180s

      - name: Show pods
        if: always()
        run: kubectl get pods -n microservices -o wide